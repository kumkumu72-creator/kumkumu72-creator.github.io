name: Temporary Glabix Fast Transcription

on:
  pull_request:
    branches: [main]

jobs:
  transcribe-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -q faster-whisper playwright requests
          python -m playwright install chromium
      - name: Download recording
        env:
          SHARE_URL: https://medford.glabix.com/share/c8ccd260-3f68-43f1-8ef4-c7954a7895b9
        run: |
          cat > getvideo.py <<'PY'
          import os,re,requests,subprocess
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          share=os.environ['SHARE_URL']; found=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True); pg=b.new_page()
              pg.on('response',lambda r: found.append(r.url) if re.search(r'\.(mp4|m3u8|webm|m4a)(\?|$)',r.url,re.I) or 'video/' in (r.headers.get('content-type') or '') else None)
              pg.goto(share,wait_until='domcontentloaded',timeout=60000)
              try: pg.locator('video').first.click(timeout=5000)
              except: pass
              pg.wait_for_timeout(12000); b.close()
          urls=list(dict.fromkeys(found)); print('\n'.join(urls))
          for u in urls:
              try:
                  if '.m3u8' in u:
                      subprocess.run(['ffmpeg','-y','-headers',f'Referer: {share}\r\nUser-Agent: Mozilla/5.0\r\n','-i',u,'-c','copy','recording.mp4'],check=True); break
                  r=requests.get(u,headers={'Referer':share,'User-Agent':'Mozilla/5.0'},stream=True,timeout=300); r.raise_for_status()
                  with open('recording.mp4','wb') as f:
                      for c in r.iter_content(1024*1024):
                          if c: f.write(c)
                  if Path('recording.mp4').stat().st_size>1000000: break
              except Exception as e: print(e)
          if not Path('recording.mp4').exists() or Path('recording.mp4').stat().st_size<1000000: raise SystemExit('video download failed')
          PY
          python getvideo.py
          ffmpeg -y -i recording.mp4 -vn -ac 1 -ar 16000 audio.wav
      - name: Fast Russian transcription
        run: |
          cat > stt.py <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          model=WhisperModel('base',device='cpu',compute_type='int8')
          segs,info=model.transcribe('audio.wav',language='ru',vad_filter=True,beam_size=1,best_of=1,condition_on_previous_text=False)
          out=[]
          for s in segs:
              def t(x): return f'{int(x//3600):02d}:{int((x%3600)//60):02d}:{x%60:06.3f}'
              out.append(f'[{t(s.start)} --> {t(s.end)}] {s.text.strip()}')
          Path('transcript_fast_ru.txt').write_text('\n'.join(out),encoding='utf-8')
          print(info.language,info.language_probability,len(out))
          PY
          python stt.py
      - uses: actions/upload-artifact@v4
        with:
          name: glabix-transcript-fast
          path: transcript_fast_ru.txt
          retention-days: 1
